name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the three-dbox combat sandbox (Vue 3 + Three.js + @base/* packages).
            Focus on:
            - Correctness bugs, especially physics/movement tick order (two Y-writers
              in a tick was a known failure class)
            - Per-frame allocations in the render loop; GPU resource disposal on
              unmount
            - Package boundary rule (@base/* packages are consumed, never edited here)
            Report only findings you are confident in, with file:line references.

            You MUST post the review to the PR — do not leave it in your final
            message only. Post one top-level summary comment via
            `gh pr comment` and use inline comments
            (mcp__github_inline_comment__create_inline_comment) only for
            code-anchored findings. If the diff is clean, post a one-line
            all-clear comment.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
